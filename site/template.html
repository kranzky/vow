<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}} · Vow</title>
  <style>
    :root { color: #202c34; background: #faf9f6; font: 17px/1.7 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #205e76; text-underline-offset: .2em; }
    a:hover { color: #843f24; }
    a:focus-visible { outline: 3px solid #c77738; outline-offset: 4px; border-radius: 2px; }
    .skip { position: absolute; top: -5rem; left: 1rem; padding: .5rem 1rem; background: white; }
    .skip:focus { top: .5rem; }
    header { border-bottom: 1px solid #deded6; background: #f0f0e9; }
    .bar { max-width: 1060px; margin: auto; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
    .brand { font: bold 2rem Georgia, serif; letter-spacing: -.05em; text-decoration: none; color: #202c34; }
    .badge { display: inline-block; margin-left: .7rem; color: #6d736c; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; }
    nav { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; font-size: .85rem; }
    nav a { text-decoration: none; }
    main { max-width: 80ch; margin: 3.5rem auto 5rem; padding: 0 2rem; overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.25; letter-spacing: -.025em; }
    h1 { font: 500 clamp(2.25rem, 5vw, 3.25rem)/1.15 Georgia, serif; margin: 0 0 1.75rem; }
    h2 { font-size: 1.5rem; margin: 2.75rem 0 1rem; padding-top: 1rem; border-top: 1px solid #deded6; }
    h3 { font-size: 1.1rem; margin-top: 2rem; }
    p { margin: 1rem 0; }
    ul, ol { padding-left: 1.5rem; }
    li { margin: .5rem 0; }
    code { font: .85em/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #eeeee7; padding: .12em .3em; border-radius: 3px; }
    pre { background: #ecf0ed; border: 1px solid #d7dfd9; border-radius: 6px; padding: 1.25rem; overflow-x: auto; tab-size: 4; }
    pre code { padding: 0; background: transparent; border-radius: 0; }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1.5rem 0; font-size: .9rem; }
    th, td { text-align: left; vertical-align: top; padding: .7rem .9rem; border: 1px solid #deded6; min-width: 8rem; }
    th { background: #eeeee7; font-weight: 600; }
    tr:nth-child(even) td { background: #f4f4ee; }
    footer { border-top: 1px solid #deded6; max-width: 1060px; margin: auto; padding: 1.5rem 2rem; color: #636d70; font-size: .8rem; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; }
    @media (max-width: 600px) {
      .bar { gap: .75rem; padding: 1rem 1.25rem; }
      nav { width: 100%; gap: .5rem 1rem; }
      main { margin-top: 2rem; padding: 0 1.25rem; }
      pre { padding: .8rem; }
      footer { padding: 1.25rem; }
    }
    @media print { header, footer, .skip { display: none; } main { max-width: none; margin: 0; } pre { white-space: pre-wrap; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <div class="bar">
      <div><a class="brand" href="index.html">Vow</a><span class="badge">Language notes · v0</span></div>
      <nav aria-label="Main navigation">
        <a href="index.html">Overview</a>
        <a href="spec.html">Specification</a>
        <a href="llms.html">For LLMs</a>
        <a href="humans.html">For humans</a>
      </nav>
    </div>
  </header>
  <main id="content">
{{content}}
  </main>
  <footer>
    <span>Written in Vow. Built with vowsite.</span>
    <a href="roadmap.html">Roadmap</a>
    <a href="license.html">Public domain</a>
  </footer>
</body>
</html>
