name: Site

# Builds vow.kranzky.com with vowsite (a verified Vow program) and publishes it to
# GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3 (the pinned version)
        run: |
          tools/install-z3.sh "$HOME/z3"
          echo "$HOME/z3" >> "$GITHUB_PATH"
      - name: Build vowc from the seed, then the site with vowsite
        run: make && make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
