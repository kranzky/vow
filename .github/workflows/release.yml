name: Release

# Builds vowc from the C seed for each platform, smoke-tests it by verifying real
# examples, and attaches the binaries (with SHA-256 checksums) to the GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install Z3 (the pinned version, and musl on Linux)
        run: |
          tools/install-z3.sh "$HOME/z3"
          echo "$HOME/z3" >> "$GITHUB_PATH"
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y musl-tools
          fi
      - name: Build vowc from the seed
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            macos-universal)
              clang -O2 -std=c11 -w -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -I runtime -o dist/vowc seed/vowc.c ;;
            linux-*)
              musl-gcc -O2 -std=c11 -w -static -I runtime -o dist/vowc seed/vowc.c ;;
          esac
          file dist/vowc
      - name: Smoke test
        run: |
          dist/vowc version
          dist/vowc run examples/bsearch.vow
          dist/vowc check examples/isort.vow
          dist/vowc check examples/escape.vow
      - name: Package
        run: |
          name="vowc-${TAG#v}-${{ matrix.target }}"
          mkdir -p "$name"
          cp dist/vowc README.md UNLICENSE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" vowc-*.tar.gz vowc-*.tar.gz.sha256 --clobber
