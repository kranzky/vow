name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The whole job takes about seven minutes; a hang must not run for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Z3 (the pinned version)
        run: |
          tools/install-z3.sh "$HOME/z3"
          echo "$HOME/z3" >> "$GITHUB_PATH"
      - name: Build vowc from the C seed
        run: make
      - name: Test with both compilers
        run: make test
      - name: Self-hosting fixpoint
        run: make bootstrap && git diff --exit-code seed/vowc.c
      - name: Soundness fuzzing with generated programs (a short run)
        run: make fuzz-gen COUNT=100
