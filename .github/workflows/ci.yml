name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Z3 (the pinned version)
        run: |
          tools/install-z3.sh "$HOME/z3"
          echo "$HOME/z3" >> "$GITHUB_PATH"
      - name: Build vowc from the C seed
        run: make
      - name: Test with both compilers
        run: make test
      - name: Self-hosting fixpoint
        run: make bootstrap && git diff --exit-code seed/vowc.c
